# Infrastructure as Code para Render
# Uso: conectalo en Render con "Blueprints" para desplegar desde este archivo.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: la-nueva-era-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: la_nueva_era
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 "app:create_app()"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://portfolio-edu444477.vercel.app
      # Secrets: NO van aquí. Defínelos en Render Dashboard → Environment.
      # - key: DATABASE_URL      (sync: Neon pooled + &options=-csearch_path%3Dtfg)
      # - key: REDIS_URL         (Upstash: redis://default:TOKEN@ENDPOINT:6379)
      # - key: JWT_SECRET_KEY    (openssl rand -hex 32)
      # - key: SECRET_KEY        (openssl rand -hex 32)
